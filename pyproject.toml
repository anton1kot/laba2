[build-system]
requires = ["setuptools>=61","wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "laba2"
version = "0.1.0"
description = "Simple CLI-package stream analyze event files"
requires-python = ">=3.12"
dependencies = [
    "pytest>=8.4.2",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["toolkit*"]

[tool.ruff]
line-length = 92
target-version = "py314"